<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
:root{
  --bg:#17150f; --panel:#1c1a13; --bar:#221f17; --fg:#e8e2d4; --dim:#8d8778;
  --line:#332f24; --accent:#e08a4b; --accent2:#8fb98a; --sel:#3a3427;
}
:root[data-theme="light"]{
  --bg:#f6f3ec; --panel:#fbf9f4; --bar:#efebe1; --fg:#2c281f; --dim:#7d7768;
  --line:#ddd7c9; --accent:#b7602a; --accent2:#4d7b48; --sel:#e7e1d3;
}
html,body{margin:0;padding:0;background:var(--bg);}
*{box-sizing:border-box;}
::selection{background:var(--sel);}
a{color:var(--accent);text-decoration:none;}
a:hover{color:var(--accent2);text-decoration:underline;}
input{font:inherit;color:inherit;background:none;border:0;outline:0;}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
#term::-webkit-scrollbar{width:10px}
#term::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
</style>
</helmet>

    <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bar);border-bottom:1px solid var(--line);">

        <div style="width:11px;height:11px;border-radius:50%;background:#7fae74;"></div>
      </div>
      <div style="flex:1;text-align:center;font-size:12px;color:var(--dim);letter-spacing:.04em;">gabriel@mondragon: ~</div>
      <div style="display:flex;gap:8px;">
        <button onClick="{{ toggleLang }}" style="font:inherit;font-size:11px;letter-spacing:.06em;padding:3px 9px;border:1px solid var(--line);border-radius:5px;background:transparent;color:var(--dim);cursor:pointer;" style-hover="color:var(--fg);border-color:var(--accent);">{{ langLabel }}</button>
        <button onClick="{{ toggleTheme }}" style="font:inherit;font-size:11px;letter-spacing:.06em;padding:3px 9px;border:1px solid var(--line);border-radius:5px;background:transparent;color:var(--dim);cursor:pointer;" style-hover="color:var(--fg);border-color:var(--accent);">{{ themeLabel }}</button>
      </div>
    </div>

    <div id="term" ref="{{ scrollRef }}" onClick="{{ focusInput }}" style="flex:1;min-height:0;overflow-y:auto;padding:22px clamp(16px,3vw,30px) 8px;font-size:14px;line-height:1.75;">
      <sc-for list="{{ lines }}" as="l" hint-placeholder-count="4">
        <div style="max-width:78ch;">
          <sc-if value="{{ l.isGap }}"><div style="height:14px;"></div></sc-if>
          <sc-if value="{{ l.isCmd }}">
            <div style="display:flex;gap:10px;margin-top:16px;">
              <span style="color:var(--accent2);">❯</span><span style="color:var(--fg);">{{ l.text }}</span>
            </div>
          </sc-if>
          <sc-if value="{{ l.isHead }}">
            <div style="color:var(--accent);font-weight:600;letter-spacing:.14em;font-size:12px;text-transform:uppercase;margin:14px 0 6px;">{{ l.text }}</div>
          </sc-if>
          <sc-if value="{{ l.isTitle }}">
            <div style="font-size:clamp(20px,3.4vw,30px);font-weight:600;letter-spacing:-.01em;color:var(--fg);line-height:1.25;">{{ l.text }}</div>
          </sc-if>
          <sc-if value="{{ l.isTxt }}"><div style="color:var(--fg);text-wrap:pretty;">{{ l.text }}</div></sc-if>
          <sc-if value="{{ l.isDim }}"><div style="color:var(--dim);text-wrap:pretty;">{{ l.text }}</div></sc-if>
          <sc-if value="{{ l.isOk }}"><div style="color:var(--accent2);">{{ l.text }}</div></sc-if>
          <sc-if value="{{ l.isErr }}"><div style="color:#d8604d;">{{ l.text }}</div></sc-if>
          <sc-if value="{{ l.isBullet }}">
            <div style="display:flex;gap:12px;color:var(--fg);text-wrap:pretty;"><span style="color:var(--dim);">–</span><span>{{ l.text }}</span></div>
          </sc-if>
          <sc-if value="{{ l.isKv }}">
            <div style="display:grid;grid-template-columns:minmax(96px,120px) 1fr;gap:6px 18px;padding:5px 0;border-bottom:1px solid var(--line);">
              <span style="color:var(--accent2);">{{ l.label }}</span><span style="color:var(--fg);text-wrap:pretty;">{{ l.text }}</span>
            </div>
          </sc-if>
          <sc-if value="{{ l.isLink }}">
            <div style="display:grid;grid-template-columns:minmax(96px,120px) 1fr;gap:6px 18px;padding:5px 0;border-bottom:1px solid var(--line);">
              <span style="color:var(--accent2);">{{ l.label }}</span><a href="{{ l.href }}" target="_blank" rel="noreferrer">{{ l.text }}</a>
            </div>
          </sc-if>
        </div>
      </sc-for>

      <sc-if value="{{ isTyping }}">
        <div style="max-width:78ch;color:var(--dim);">{{ typingText }}<span style="display:inline-block;width:8px;background:var(--accent);animation:blink 1s steps(1) infinite;color:transparent;">.</span></div>
      </sc-if>

      <sc-if value="{{ ready }}">
        <div style="display:flex;gap:10px;align-items:baseline;margin-top:18px;padding-bottom:14px;">

          <input ref="{{ inputRef }}" value="{{ input }}" onChange="{{ onChange }}" onKeyDown="{{ onKeyDown }}" placeholder="{{ placeholder }}" spellcheck="false" autocomplete="off" style="flex:1;color:var(--fg);caret-color:var(--accent);font-size:14px;" />
        </div>
      </sc-if>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:8px;padding:12px clamp(16px,3vw,30px);border-top:1px solid var(--line);background:var(--bar);">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="5">
        <button onClick="{{ m.run }}" style="font:inherit;font-size:12.5px;padding:5px 12px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--dim);cursor:pointer;transition:color .15s,border-color .15s;" style-hover="color:var(--accent);border-color:var(--accent);">{{ m.cmd }}</button>
      </sc-for>
    </div>

  </div>
</div>

class Component extends DCLogic {
  state = { lines: [], typing: null, ready: false, input: '', theme: 'dark', lang: 'en', history: [], hpos: -1 };

  constructor(p) {
    super(p);
    this.scrollRef = React.createRef();
    this.inputRef = React.createRef();
    this.queue = [];
  }

  componentDidMount() {
    const theme = (typeof localStorage !== 'undefined' && localStorage.getItem('gm_theme')) || 'dark';
    const lang = (typeof localStorage !== 'undefined' && localStorage.getItem('gm_lang')) || 'en';
    document.documentElement.dataset.theme = theme;
    this.setState({ theme, lang });
    this.boot(lang);
  }

  componentWillUnmount() { clearTimeout(this.timer); }

  componentDidUpdate() {
    const el = this.scrollRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  }

  boot(lang) {
    const inst = this.props.instantBoot;
    const seq = DATA[lang].boot;
    if (inst) { this.setState({ lines: seq.slice(), ready: true }); return; }
    this.queue = seq.slice();
    this.next();
  }

  next() {
    if (!this.queue.length) {
      this.setState({ ready: true }, () => this.focusInput());
      return;
    }
    const item = this.queue.shift();
    if (item.k === 'gap' || item.k === 'title') {
      this.setState(s => ({ lines: s.lines.concat(item) }));
      this.timer = setTimeout(() => this.next(), item.k === 'title' ? 260 : 90);
      return;
    }
    const speed = Number(this.props.typeSpeed ?? 12);
    let i = 0;
    const tick = () => {
      i += 2;
      if (i >= item.text.length) {
        this.setState(s => ({ lines: s.lines.concat(item), typing: null }));
        this.timer = setTimeout(() => this.next(), 180);
      } else {
        this.setState({ typing: item.text.slice(0, i) });
        this.timer = setTimeout(tick, speed);
      }
    };
    tick();
  }

  focusInput = () => { const el = this.inputRef.current; if (el) el.focus(); };

  push(arr) { this.setState(s => ({ lines: s.lines.concat(arr) })); }

  run = (raw) => {
    const t = DATA[this.state.lang];
    const cmd = String(raw || '').trim().toLowerCase().replace(/^\//, '');
    if (!cmd) return;
    const echo = { k: 'cmd', text: '/' + cmd };
    this.setState(s => ({ history: s.history.concat('/' + cmd), hpos: -1 }));
    if (cmd === 'clear' || cmd === 'cls') { this.setState({ lines: [{ k: 'dim', text: t.cleared }] }); return; }
    if (cmd === 'theme' || cmd === 'dark' || cmd === 'light') { this.push([echo]); this.toggleTheme(); return; }
    if (cmd === 'es' || cmd === 'en' || cmd === 'lang') { this.push([echo]); this.setLang(cmd === 'lang' ? (this.state.lang === 'en' ? 'es' : 'en') : cmd); return; }
    if (cmd === 'help' || cmd === '?' || cmd === 'ls') { this.push([echo].concat(t.help)); return; }
    if (cmd === 'about' || cmd === 'whoami') { this.push([echo].concat(t.about)); return; }
    if (cmd === 'skills' || cmd === 'stack') { this.push([echo].concat(t.skills)); return; }
    if (cmd === 'contact' || cmd === 'hire') { this.push([echo].concat(t.contact)); return; }
    this.push([echo, { k: 'err', text: t.notfound('/' + cmd) }]);
  };

  toggleTheme = () => {
    const theme = this.state.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem('gm_theme', theme); } catch (e) {}
    this.setState({ theme });
  };

  setLang = (lang) => {
    try { localStorage.setItem('gm_lang', lang); } catch (e) {}
    this.setState({ lang });
  };

  toggleLang = () => this.setLang(this.state.lang === 'en' ? 'es' : 'en');

  onKeyDown = (e) => {
    if (e.key === 'Enter') { this.run(this.state.input); this.setState({ input: '' }); return; }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      const h = this.state.history;
      if (!h.length) return;
      const p = this.state.hpos < 0 ? h.length - 1 : Math.max(0, this.state.hpos - 1);
      this.setState({ hpos: p, input: h[p] });
      return;
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      const h = this.state.history;
      if (this.state.hpos < 0) return;
      const p = this.state.hpos + 1;
      if (p >= h.length) this.setState({ hpos: -1, input: '' });
      else this.setState({ hpos: p, input: h[p] });
      return;
    }
    if (e.key === 'Tab') {
      e.preventDefault();
      const cur = this.state.input.replace(/^\//, '').toLowerCase();
      const hit = ['about', 'skills', 'contact', 'help', 'theme', 'clear'].find(c => cur && c.startsWith(cur));
      if (hit) this.setState({ input: '/' + hit });
    }
  };

  renderVals() {
    const t = DATA[this.state.lang];
    const lines = this.state.lines.map((l, i) => ({
      key: i, label: l.label, text: l.text, href: l.href,
      isGap: l.k === 'gap', isCmd: l.k === 'cmd', isHead: l.k === 'head', isTitle: l.k === 'title',
      isTxt: l.k === 'txt', isDim: l.k === 'dim', isOk: l.k === 'ok', isErr: l.k === 'err',
      isBullet: l.k === 'bullet', isKv: l.k === 'kv', isLink: l.k === 'link'
    }));
    const menu = ['/about', '/skills', '/contact', '/help', '/clear'].map(c => ({ cmd: c, run: () => { this.run(c); this.focusInput(); } }));
    return {
      lines, menu,
      isTyping: !!this.state.typing,
      typingText: this.state.typing || '',
      ready: this.state.ready,
      input: this.state.input,
      placeholder: t.placeholder,
      onChange: (e) => this.setState({ input: e.target.value }),
      onKeyDown: this.onKeyDown,
      inputRef: this.inputRef,
      scrollRef: this.scrollRef,
      focusInput: this.focusInput,
      toggleTheme: this.toggleTheme,
      toggleLang: this.toggleLang,
      themeLabel: this.state.theme === 'dark' ? '☾ dark' : '☀ light',
      langLabel: this.state.lang === 'en' ? 'EN' : 'ES'
    };
  }
}
</script>
</body>
</html>
